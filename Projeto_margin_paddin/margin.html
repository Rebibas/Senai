<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>margin e paddin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="color">
    <h1 id="h1">🎮 Margin e Padding — Estilo Gamer</h1>
    <div class="Padding">
        <h4>🎯Padding: 30px — espaço interno</h4>
        <h4>O escudo azul cresceu para dentro.</h4>
    </div>
    <div class="Margin">
        <h4>⚔️ Margin: 30px — espaço externo</h4>
        <h4>O bloco verde se afastou dos outros.</h4>
    </div>
    <div class="MarginPadding">
        <h4>🔥 Margin: 20px + Padding: 20px</h4>
        <h4>Margin afasta por fora. Padding cresce por dentro.</h4>
    </div>
</body>
</html>
